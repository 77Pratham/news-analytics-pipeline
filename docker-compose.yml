services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: news
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build: .
    image: news-pipeline-v2:latest
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["airflow", "db", "migrate"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://news:news@postgres:5432/news
      PIPELINE_DB_DSN: "dbname=news user=news password=news host=postgres port=5432"

  airflow-webserver:
    build: .
    image: news-pipeline-v2:latest
    depends_on:
      - airflow-init
    command: airflow webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://news:news@postgres:5432/news
      PIPELINE_DB_DSN: "dbname=news user=news password=news host=postgres port=5432"
      NEWSAPI_KEY: ${NEWSAPI_KEY}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./enrichment:/opt/airflow/enrichment
      - ./quality:/opt/airflow/quality

  airflow-scheduler:
    build: .
    image: news-pipeline-v2:latest
    depends_on:
      - airflow-init
    command: airflow scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://news:news@postgres:5432/news
      PIPELINE_DB_DSN: "dbname=news user=news password=news host=postgres port=5432"
      NEWSAPI_KEY: ${NEWSAPI_KEY}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./enrichment:/opt/airflow/enrichment
      - ./quality:/opt/airflow/quality

  api:
    build: .
    image: news-pipeline-v2:latest
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PIPELINE_DB_DSN: "dbname=news user=news password=news host=postgres port=5432"

  dashboard:
    build: .
    image: news-pipeline-v2:latest
    command: streamlit run dashboard/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://api:8000"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  pgdata:
  ollama_models: